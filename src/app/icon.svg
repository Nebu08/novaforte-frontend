<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="32" height="32" viewBox="0 0 80 80">
  <!-- Favicon Novaforte: corazón-circuito del logo oficial (silueta de logo.svg) en Oro Champagne sobre Burdeos Firma -->
  <defs>
    <mask id="nf-heart" maskUnits="userSpaceOnUse" x="0" y="0" width="80" height="80">
      <image x="5" y="5" width="70" height="70" xlink:href="data:image/png;base64,"/>
    </mask>
  </defs>
  <rect width="80" height="80" rx="16" fill="#7e192a"/>
  <rect width="80" height="80" fill="#c5a059" mask="url(#nf-heart)"/>
</svg>
